{% extends "base.html" %}
{% block title %}Settings · ECU Master{% endblock %}
{% block content %}
<section class="page-heading">
    <div>
        <p class="eyebrow">Application settings</p>
        <h1>Settings</h1>
        <p>Manage local dashboard preferences.</p>
    </div>
</section>

<section class="card settings-panel" id="dashboard-settings">
    <form class="settings-grid">
        <label>Language
            <select name="language">
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </label>
        <div class="button-row settings-actions">
            <button class="primary" type="submit">Save settings</button>
            <button class="secondary" id="reset-settings" type="button">Reset</button>
            <span class="muted" id="settings-state" aria-live="polite"></span>
        </div>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/settingsDashboard.js') }}"></script>
{% endblock %}
