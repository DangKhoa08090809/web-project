<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · ECU Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="login-page">
    <section class="login-card">
        <div class="login-brand"><span>ECU</span> Master</div>
        <p>Sign in to monitor your vehicle readers and telemetry.</p>
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        <form method="post" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
            <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
            <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
            <button class="primary" type="submit">Sign in</button>
        </form>
    </section>
</body>
</html>
