# Example reverse proxy for https://drisafe.haithinh.top.
# TLS certificate directives are intentionally placeholders.

server {
    listen 80;
    listen [::]:80;
    server_name drisafe.haithinh.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drisafe.haithinh.top;

    ssl_certificate /etc/letsencrypt/live/drisafe.haithinh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drisafe.haithinh.top/privkey.pem;

    client_max_body_size 2m;

    location ~ ^/api/devices/[^/]+/live/stream$ {
        proxy_pass http://drisafe-web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://drisafe-web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }
}
