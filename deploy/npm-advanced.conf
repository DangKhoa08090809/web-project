# Paste this into the Nginx Proxy Manager "Advanced" field for
# drisafe.haithinh.top when the proxy host points to drisafe-web:5000.
#
# Cloudflare Tunnel already reaches NPM over local HTTP. Keep Force SSL off in
# NPM for this host, and let Cloudflare provide the browser-facing HTTPS scheme.

client_max_body_size 2m;

# Optional technical diagnostic stream. The main cloud dashboard is historical,
# but this keeps the existing device-specific Live Preview SSE endpoint healthy
# behind NPM if it is used for bench diagnostics.
location ~ ^/api/devices/[^/]+/live/stream$ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;

    include conf.d/include/proxy.conf;
}
